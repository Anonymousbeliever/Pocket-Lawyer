# Pocket Lawyer — document registry
#
# One entry per document VERSION. Two versions of the same Act are two
# entries sharing a document_id and differing in version; they never
# overwrite each other, because identity is document_id@vversion.
#
# Adding a document of a type that already has adapters (cleaner /
# structure / validator below) means adding an entry here and nothing
# else. A genuinely new document type needs one new structure adapter.
#
# Fields:
#   document_id     stable across versions; with version it forms both
#                   the chunk id prefix and the artifact directory name
#   version         edition of the law, not of this pipeline
#   effective_from  when this version took effect (ISO date)
#   effective_to    when it was superseded; null while operative
#   in_force        exactly one version of a document may be true
#   cleaner /
#   structure /
#   validator       adapter names, resolved in data_pipeline.adapters

- document_id: constitution-of-kenya-2010
  title: "Constitution of Kenya, 2010"
  document_type: constitution
  jurisdiction: Kenya
  language: English
  version: "2010"
  effective_from: "2010-08-27"
  effective_to: null
  in_force: true
  source:
    name: "Kenya Law"
    url: null
  raw_path: "data/raw/constitution/constitution-of-kenya-2010.pdf"
  cleaner: constitution
  structure: constitution
  validator: constitution

# The consolidated edition, not the 1930 enactment: `version` and
# `effective_from` are the "Legislation as at" date on the PDF, which
# matches its FRBR URI. The Act commenced on 1 August 1930; that is a
# fact about the Act, not about this version, and has no field here.
- document_id: criminal-procedure-code
  title: "Criminal Procedure Code (Cap. 75)"
  document_type: act
  jurisdiction: Kenya
  language: English
  version: "2023-12-11"
  effective_from: "2023-12-11"
  effective_to: null
  in_force: true
  source:
    name: "Kenya Law"
    url: "https://new.kenyalaw.org/akn/ke/act/1930/11/eng@2023-12-11"
  raw_path: "data/raw/legislation/criminal-procedure-code.pdf"
  cleaner: criminal-procedure-code
  structure: act
  validator: criminal-procedure-code

# Reuses the `act` structure parser, which gained optional Chapter support for
# this document: the Penal Code is Part -> Chapter -> Section where the
# Criminal Procedure Code is Part -> Section. Same consolidation date as the
# CPC, different act number in the FRBR URI (10 rather than 11).
- document_id: penal-code
  title: "Penal Code (Cap. 63)"
  document_type: act
  jurisdiction: Kenya
  language: English
  version: "2023-12-11"
  effective_from: "2023-12-11"
  effective_to: null
  in_force: true
  source:
    name: "Kenya Law"
    url: "https://new.kenyalaw.org/akn/ke/act/1930/10/eng@2023-12-11"
  raw_path: "data/raw/legislation/penal-code.pdf"
  cleaner: penal-code
  structure: act
  validator: penal-code

# The first civil document in the corpus, and the first to be cited by its
# consolidated Chapter rather than its year: enacted as the Employment Act,
# 2007, published here as Cap. 226. `version` is the consolidation date, not
# 2007 - the Act commenced on 2 June 2008, which is a fact about the Act and
# has no field.
#
# Reuses the `act` structure parser, which needed one fix: this Act numbers
# its first Part in Arabic ("Part 1") and the rest in Roman, and the
# Roman-only pattern was dropping sections 1 to 3 in silence.
- document_id: employment-act
  title: "Employment Act (Cap. 226)"
  document_type: act
  jurisdiction: Kenya
  language: English
  version: "2024-04-26"
  effective_from: "2024-04-26"
  effective_to: null
  in_force: true
  source:
    name: "Kenya Law"
    url: "https://new.kenyalaw.org/akn/ke/act/2007/11/eng@2024-04-26"
  raw_path: "data/raw/legislation/employment-act.pdf"
  cleaner: employment-act
  structure: act
  validator: employment-act
