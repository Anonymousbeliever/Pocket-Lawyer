  answerable: true
  expect_any_of:
    - law-of-succession-act@v2022-12-31-part-viii-section-96
  note: >
    Section 96. Deliberately cross-document in spirit: the crime is in the
    Penal Code, the inheritance consequence is here.

- id: succession-muslim-estate
  question: "Does this law apply to the estate of a Muslim who has died?"
  answerable: true
  expect_any_of:
    - law-of-succession-act@v2022-12-31-section-2
  note: >
    Section 2(3) excludes Muslim estates, which are governed by Muslim law.
