    - criminal-procedure-code@v2023-12-11-part-iv-section-137a
    - criminal-procedure-code@v2023-12-11-part-iv-section-137b
  note: "Sections 137A-137N. Inserted by amendment - lettered sections a digits-only parser would have dropped."

- id: cpc-tried-twice
  question: "Can I be taken to court twice for the same offence?"
