# =========================================================
# ANSWERABLE - Penal Code (Cap. 63)
#
# The third document, and the one that closes the gap a live demo hit:
# "tell me the criminal code on robbery" correctly refused, because the
# Criminal Procedure Code governs how a case is RUN while the Penal Code
# defines what the offences ARE.
#
# These are offence-definition questions - what something is, and what the
# punishment is. Several deliberately pair with the CPC: an offence here,
# the procedure there.
#
# REVIEW NOTE: drafted from section titles and the retrieved text, not a
# full reading of the Code. Correct anything legally wrong.
# =========================================================

- id: penal-robbery
