- id: county-government-role
  question: "What are county governments responsible for?"
  answerable: true
  expect_any_of:
    - constitution-of-kenya-2010@v2010-fourth-schedule-part-1
    - constitution-of-kenya-2010@v2010-fourth-schedule-part-2
    - constitution-of-kenya-2010@v2010-chapter-eleven-article-186
  note: >
    Corrected 2026-09-23. This question failed for eighteen runs because the
    expectations were wrong, not the system.

    Article 186 does not list county functions. Its operative text is a
    pointer: the functions "are as set out in the Fourth Schedule". The list
    itself - agriculture, county health services, county transport, trade
    regulation, pre-primary education - lives in the Schedule, and reranking
    was surfacing it correctly while the harness scored that a miss.

    Article 186 is kept because it is the provision that assigns the
    functions, so citing it alongside the Schedule is legitimate. Articles
    183 and 174 were REMOVED: 183 is the functions of the county executive
    *committee*, a different question, and 174 is the objects of devolution
    - why devolution exists, not what a county does. Leaving them in would
    let this question pass on authority that does not answer it.

    Note the Schedule spans two chunks because a 4,000-character cap split
    it mid-list: county functions 1-4 end `-part-1`, and 5 onward open
    `-part-2`. Both are legitimate hits until chunking respects the
    Schedule's own Part 1 / Part 2 boundary.

