# =========================================================
# ANSWERABLE - Criminal Procedure Code (Cap. 75)
#
# Added when the Code was indexed alongside the Constitution. These are
# procedure questions: what the police and the courts may actually do,
# as distinct from the rights in Chapter Four that constrain them.
#
# Several deliberately overlap the arrest questions above. That overlap
# is the point - it is where a right and a procedure both apply, and it
# is exactly where retrieval went wrong when the second document landed.
#
# REVIEW NOTE: as with the Constitution set, these were drafted from
# section titles and a reading of the retrieved text, not a full
# reading of the Code. Correct anything legally wrong.
# =========================================================

- id: cpc-arrest-without-warrant
  question: "When can the police arrest someone without a warrant?"
  answerable: true
  expect_any_of:
    - criminal-procedure-code@v2023-12-11-part-iii-section-29
    - criminal-procedure-code@v2023-12-11-part-iii-section-30
  note: "Section 29 is the general power; section 30 covers named categories."

- id: cpc-citizen-arrest
  question: "Can an ordinary person arrest someone who has committed a crime?"
  answerable: true
  expect_any_of:
    - criminal-procedure-code@v2023-12-11-part-iii-section-34
    - criminal-procedure-code@v2023-12-11-part-iii-section-35
  note: "Section 34 permits it; section 35 governs what must happen next."

- id: cpc-detention-before-court
