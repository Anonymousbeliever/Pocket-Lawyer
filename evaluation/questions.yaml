# =========================================================
# OUT OF SCOPE - must refuse
#
# The Constitution does not contain these answers. Each requires an
# Act, subsidiary legislation, or court rules that are not yet in the
# corpus. When those are ingested, move the question up.
# =========================================================

- id: divorce-process
  question: "What is the legal process for filing for divorce in Kenya?"
  answerable: true
  expect_any_of:
    - marriage-act@v2022-12-31-part-x-section-66
    - marriage-act@v2022-12-31-part-x-section-65
    - marriage-act@v2022-12-31-part-x-section-69
  note: >
    **The original refusal test case**, and the reason the corpus exists in
    its present shape. In the very first Phase 3 tests this question was
    correctly refused over a Constitution-only corpus, and that refusal was
    recorded as desired behaviour rather than a bug. It stayed out of scope
    for five documents.

    Section 66 is the right to petition for separation or divorce; 65 gives
    the grounds for dissolving a Christian marriage and 69 for a customary
    one. Wording unchanged from the day it was written, so the flip is
    honest.

