  answerable: true
  expect_any_of:
    - law-of-succession-act@v2022-12-31-part-vii-section-45
  note: >
    Section 45 alone, and deliberately narrow. Written because
    succession-intermeddling turned out to admit two readings; this one
    names the situation - no grant, no appointment - that only section 45
    answers. The single most common real dispute in Kenyan succession.

- id: succession-grant-application
  question: "How do I get legal authority to deal with a dead relative's estate?"
  answerable: true
  expect_any_of:
    - law-of-succession-act@v2022-12-31-part-vii-section-51
    - law-of-succession-act@v2022-12-31-part-vii-section-53
  note: "Section 51 application for a grant; 53 the forms of grant."

