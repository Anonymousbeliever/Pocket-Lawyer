  answerable: true
  expect_any_of:
    - law-of-succession-act@v2022-12-31-part-vii-section-71
    - law-of-succession-act@v2022-12-31-part-vii-section-55
  note: "Section 71 confirmation of grants; 55 no distribution before it."

- id: succession-killer-inherits
