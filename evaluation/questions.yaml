- id: succession-intermeddling
  question: "Can relatives start sharing out property before the court allows it?"
  answerable: true
  expect_any_of:
    - law-of-succession-act@v2022-12-31-part-vii-section-45
    - law-of-succession-act@v2022-12-31-part-vii-section-55
    - law-of-succession-act@v2022-12-31-part-vii-section-71
  note: >
    Corrected 2026-09-23, the day it was written. As worded this question
    is ambiguous between two different legal situations, and the original
    expectation named only one of them.

    Section 45 covers people with NO grant helping themselves - taking
    possession or disposing of a deceased's property, which is an offence.
    Section 55 covers an administrator who HAS a grant distributing capital
    before the grant is confirmed under section 71.

    "Relatives sharing out property before the court allows it" describes
    both. Reranking returned 55 first and 71 third - a coherent and legally
    correct answer to one reading - and the harness scored it a miss. All
    three are legitimate; the question is kept as a citizen would phrase it,
    and succession-taking-property-before-grant below tests section 45
    unambiguously.

- id: succession-taking-property-before-grant
