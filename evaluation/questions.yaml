# Pocket Lawyer — evaluation question set
#
# The golden set. This file is the actual asset; the runner is just
# machinery around it.
#
#   answerable: true   the indexed corpus contains the answer, and at
#                      least one chunk in expect_any_of must surface
#   answerable: false  the corpus cannot answer this, and the system
#                      must say so rather than improvise
#
# expect_any_of lists every authority that would be a legitimate hit,
# not just the single best one. Several articles are often genuinely
# relevant, and demanding one exact chunk would produce false failures.
#
# Questions are phrased the way an ordinary person would ask them, not
# in legal language - that is the retrieval problem worth measuring.
#
# As the corpus grows, out-of-scope questions become answerable. Move
# them by setting answerable: true and filling expect_any_of. That
# migration is the record of the corpus improving.
#
# REVIEW NOTE: expectations below were drafted against article titles,
# not a reading of every article's full text. Please correct anything
# legally wrong - a wrong expectation here teaches the harness to
# assert the wrong thing forever.

# =========================================================
# ANSWERABLE - Chapter Four, Bill of Rights
# =========================================================

- id: arrest-reason
  question: "Can police arrest me without telling me why?"
  answerable: true
  expect_any_of:
    - constitution-of-kenya-2010@v2010-chapter-four-article-49
  note: "Article 49(1)(a). The worked example used throughout this project."

