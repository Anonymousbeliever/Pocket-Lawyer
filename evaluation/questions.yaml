  expect_any_of:
    - criminal-procedure-code@v2023-12-11-part-ixa-section-329a
    - criminal-procedure-code@v2023-12-11-part-ixa-section-329c
  note: "Part IXA. The Part whose Roman numeral carries a letter suffix."

- id: cpc-compensation-order
  question: "Can a court order a convicted person to compensate their victim?"
  answerable: true
  expect_any_of:
    - criminal-procedure-code@v2023-12-11-part-iv-section-175
  note: "Section 175."
