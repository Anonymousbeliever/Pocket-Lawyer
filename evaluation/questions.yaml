  note: "Article 49(1)(a)(ii) and (b) - right to remain silent."

- id: arrest-bail
  question: "Can I be released on bail while waiting for my trial?"
  answerable: true
  expect_any_of:
    - constitution-of-kenya-2010@v2010-chapter-four-article-49
  note: >
    Article 49(1)(h) - bond or bail unless compelling reasons.
    Deliberately kept Constitution-only even though Criminal Procedure
    Code section 123 is a legitimate answer to the same words. Widening
    it would let this question pass on the Code alone, hiding exactly
    the failure it caught once: Article 49 falling out of retrieval
    entirely. The Code side is measured by cpc-bail-before-trial.

